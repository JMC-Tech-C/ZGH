body {

img {

}

button {
  background-color: black;

  color: white;
  padding: 1%;
  display: inline-block;
  text-align: center;
  text-decoration: none;
  font-family: Arial, Helvetica, sans-serif;
  font-weight: none;
  font-size: 88%;
  font-style: none;
  min-width: 20%;
  border-radius: 13px;
}

textarea {
  background-color: black;
  border: 1px solid white;
  border-radius: 13px;
  color: white;
  font-size: 18px;
  padding: 3%;
  font-family: Arial, Helvetica, sans-serif;
}

input {
  background-color: black;
  border: 1px solid white;
  color: white;
  padding: 1%;
  display: inline-block;
  text-align: center;
  text-decoration: none;
  font-family: Arial, Helvetica, sans-serif;
  font-weight: none;
  font-size: 18px;
  font-style: none;
  min-width: 20%;
  border-radius: 13px;
}

/* Style the search field */
form.bar input[type=text] {
  padding: 0.4%;
  font-size: 88%;
  border: 1px solid white;
  width: 50%;
  background: black;
  color: white;
  border-radius: 13px;
}

/* Style the submit button */
form.bar button {
  float: left;
  width: 30%;
  background: black;
  color: white;
  padding: 0.5%;
  font-size: 88%;
  border: 1px solid #555;
  border-left: none; /* Prevent double borders */
  cursor: pointer;
}

form.bar button:hover {
  background: black;
  color: #555;
}

/* Clear floats */
form.bar::after {
  content: "";
  clear: both;
  display: table;
}

document.onkeydown = checkKey;

function checkKey(e) {

    e = e || window.event;

    if (e.keyCode == '13') {

    }
    else if (e.keyCode == '16') {
        // SHIFT
		window.location.reload();
    }
}
